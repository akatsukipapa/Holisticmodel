<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTuber Complete Edition - Full Body & Hand Tracking</title>
    <style>
      body {
        margin: 0;
        background-color: #222;
        overflow: hidden;
        font-family: monospace;
      }
      .container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      /* カメラ映像：トグル可能 */
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(-1);
        object-fit: cover;
        z-index: 0;
        transition: opacity 0.3s ease;
      }
      canvas#skeleton-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(-1);
        z-index: 1;
        pointer-events: none;
      }
      /* 操作ガイド */
      #controls {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 220px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 12px;
        border-radius: 10px;
        z-index: 1000;
        font-size: 11px;
        pointer-events: none;
        line-height: 1.6;
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(5px);
      }
      .key {
        display: inline-block;
        background: #555;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: bold;
        border: 1px solid #888;
        min-width: 18px;
        text-align: center;
      }
      .section-title {
        color: #00ffcc;
        font-weight: bold;
        margin-top: 8px;
        margin-bottom: 4px;
      }
      .section-title:first-child {
        margin-top: 0;
      }
      /* ステータス */
      #status-panel {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 8px 12px;
        border-radius: 10px;
        z-index: 1000;
        font-size: 12px;
        pointer-events: none;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .ok { color: #00ff00; }
      .tracking { color: #ffcc00; }
      /* ボタン群 */
      .btn-container {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        z-index: 100;
      }
      .action-btn {
        padding: 12px 30px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #888;
        background: #333;
        border: 2px solid #555;
        border-radius: 50px;
        cursor: not-allowed;
        transition: all 0.3s;
      }
      .action-btn.ready {
        color: #fff;
        background: linear-gradient(45deg, #ff00cc, #3333ff);
        border: none;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(255, 0, 204, 0.5);
      }
      .action-btn.ready:hover {
        box-shadow: 0 0 30px rgba(255, 0, 204, 0.8);
        transform: scale(1.05);
      }
      .action-btn.bg-toggle {
        background: linear-gradient(45deg, #00ccff, #0066ff);
        box-shadow: 0 0 20px rgba(0, 204, 255, 0.5);
      }
      .action-btn.bg-toggle:hover {
        box-shadow: 0 0 30px rgba(0, 204, 255, 0.8);
      }
      .action-btn.bg-off {
        background: linear-gradient(45deg, #666, #444);
        box-shadow: 0 0 10px rgba(100, 100, 100, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="status-panel">
      VRM: <span id="st-vrm" style="color: red">Loading...</span><br />
      背景: <span id="st-bg" class="ok">ON</span>
    </div>
    <!-- 操作ガイド -->
    <div id="controls">
      <div class="section-title">📍 位置調整 (Position)</div>
      <span class="key">↑</span> <span class="key">↓</span> : 上下移動<br />
      <span class="key">←</span> <span class="key">→</span> : 左右移動<br />
      <span class="key">W</span> : ズームイン<br />
      <span class="key">S</span> : ズームアウト<br />
      <span class="key">R</span> : 位置リセット<br />
      <div class="section-title">🎬 表示切替 (Display)</div>
      <span class="key">B</span> : 背景カメラ ON/OFF<br />
      <div class="section-title">🦴 トラッキング対象</div>
      顔・体・腕・足・指
    </div>
    <div class="container">
      <video id="input-video" playsinline muted autoplay></video>
      <canvas id="skeleton-canvas"></canvas>
    </div>
    <div class="btn-container">
      <button id="toggle-btn" class="action-btn" disabled>Loading Model...</button>
      <button id="bg-btn" class="action-btn ready bg-toggle">背景 ON</button>
    </div>

    <!-- ライブラリの読み込み -->
    <script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@1.0.0/lib/three-vrm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>

    <script>
      // ============================================================
      //  VTuber Complete Edition
      //  - Face, Body, Legs, Hands (Fingers) Full Tracking
      //  - Background Camera Toggle (B key or Button)
      // ============================================================
      const videoElement = document.getElementById("input-video");
      const skeletonCanvas = document.getElementById("skeleton-canvas");
      const skelCtx = skeletonCanvas.getContext("2d");
      const toggleBtn = document.getElementById("toggle-btn");
      const bgBtn = document.getElementById("bg-btn");
      const stVrm = document.getElementById("st-vrm");
      const stBg = document.getElementById("st-bg");
      
      const VRM_FILE_PATH = "./avatar.vrm";
      let currentVrm = null;
      let isAvatarMode = false;
      let isBgVisible = true;

      // --- 1. Three.js Setup ---
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.domElement.id = "avatar-canvas";
      renderer.domElement.style.cssText = "position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; display:none;";
      document.querySelector(".container").appendChild(renderer.domElement);
      
      const scene = new THREE.Scene();
      const initialPos = { x: 0.0, y: 1.3, z: 2.0 };
      const camera = new THREE.PerspectiveCamera(30.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
      camera.position.set(initialPos.x, initialPos.y, initialPos.z);
      
      scene.add(new THREE.DirectionalLight(0xffffff, 0.8));
      scene.add(new THREE.AmbientLight(0x606060));

      // --- 背景トグル関数 ---
      function toggleBackground() {
        isBgVisible = !isBgVisible;
        videoElement.style.opacity = isBgVisible ? "1.0" : "0.0";
        stBg.innerText = isBgVisible ? "ON" : "OFF";
        stBg.className = isBgVisible ? "ok" : "tracking";
        bgBtn.innerText = isBgVisible ? "背景 ON" : "背景 OFF";
        bgBtn.classList.toggle("bg-off", !isBgVisible);
        bgBtn.classList.toggle("bg-toggle", isBgVisible);
      }

      // --- キーボード操作 ---
      window.addEventListener("keydown", (e) => {
        if (e.key === "b" || e.key === "B") {
          toggleBackground();
          return;
        }
        if (!isAvatarMode) return;
        const moveStep = 0.1;
        switch (e.key) {
          case "ArrowUp": camera.position.y += moveStep; break;
          case "ArrowDown": camera.position.y -= moveStep; break;
          case "ArrowLeft": camera.position.x -= moveStep; break;
          case "ArrowRight": camera.position.x += moveStep; break;
          case "w": case "W": camera.position.z -= moveStep; break;
          case "s": case "S": camera.position.z += moveStep; break;
          case "r": case "R": camera.position.set(initialPos.x, initialPos.y, initialPos.z); break;
        }
      });
      bgBtn.addEventListener("click", toggleBackground);

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        skeletonCanvas.width = window.innerWidth;
        skeletonCanvas.height = window.innerHeight;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize);
      resize();

      // --- 2. VRM Load ---
      new THREE.GLTFLoader()
        .register((p) => new THREE_VRM.VRMLoaderPlugin(p))
        .load(
          VRM_FILE_PATH,
          (gltf) => {
            currentVrm = gltf.userData.vrm;
            scene.add(currentVrm.scene);
            currentVrm.scene.rotation.y = Math.PI; // モデルを正面に向ける
            currentVrm.scene.position.set(0, 0, 0);
            
            stVrm.innerText = "OK (Ready)";
            stVrm.className = "ok";
            toggleBtn.disabled = false;
            toggleBtn.classList.add("ready");
            toggleBtn.innerText = "🎭 アバター ON";
          },
          undefined,
          (e) => {
            stVrm.innerText = "Error: " + (e.message || "Load Failed");
            console.error("VRM Load Error:", e);
          }
        );

      // --- 3. Toggle Button ---
      toggleBtn.addEventListener("click", () => {
        if (!currentVrm) return;
        isAvatarMode = !isAvatarMode;
        const avatarCanvas = document.getElementById("avatar-canvas");
        if (isAvatarMode) {
          avatarCanvas.style.display = "block";
          skeletonCanvas.style.display = "none";
          toggleBtn.innerText = "🦴 骨格モード";
        } else {
          avatarCanvas.style.display = "none";
          skeletonCanvas.style.display = "block";
          toggleBtn.innerText = "🎭 アバター ON";
        }
      });

      // --- 4. Holistic Setup ---
      const holistic = new Holistic({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${f}`,
      });
      holistic.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7,
        refineFaceLandmarks: true,
      });

      // --- 5. VRM ボーン適用ヘルパー (Kalidokit用) ---
      // 取得したオイラー角を、Three.jsのQuaternionに変換してVRMのボーンに安全に適用します
      const rigRotation = (boneName, rotation = { x: 0, y: 0, z: 0 }, dampener = 1, lerpAmount = 0.3) => {
        if (!currentVrm) return;
        // Kalidokitのボーン名(RightUpperArm)を、VRM 1.0のボーン名(rightUpperArm)に変換
        const vrmBoneName = boneName.charAt(0).toLowerCase() + boneName.slice(1);
        const node = currentVrm.humanoid.getNormalizedBoneNode(vrmBoneName);
        if (!node) return;

        const euler = new THREE.Euler(
          rotation.x * dampener,
          rotation.y * dampener,
          rotation.z * dampener,
          "XYZ"
        );
        const quaternion = new THREE.Quaternion().setFromEuler(euler);
        node.quaternion.slerp(quaternion, lerpAmount);
      };

      // 腰(Hips)の位置調整用
      const rigPosition = (boneName, position = { x: 0, y: 0, z: 0 }, dampener = 1, lerpAmount = 0.3) => {
        if (!currentVrm) return;
        const vrmBoneName = boneName.charAt(0).toLowerCase() + boneName.slice(1);
        const node = currentVrm.humanoid.getNormalizedBoneNode(vrmBoneName);
        if (!node) return;

        node.position.lerp(
          new THREE.Vector3(
            position.x * dampener,
            position.y * dampener,
            position.z * dampener
          ),
          lerpAmount
        );
      };

      // --- 6. MediaPipe Results Handler ---
      holistic.onResults((results) => {
        if (!isAvatarMode) {
          // 骨格表示モード（既存のまま）
          skelCtx.save();
          skelCtx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
          drawConnectors(skelCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: "#00FF00", lineWidth: 3 });
          drawLandmarks(skelCtx, results.poseLandmarks, { color: "#FF0000", lineWidth: 2, radius: 4 });
          drawConnectors(skelCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: "#00CCFF", lineWidth: 3 });
          drawLandmarks(skelCtx, results.leftHandLandmarks, { color: "#0088FF", lineWidth: 1, radius: 3 });
          drawConnectors(skelCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: "#FFCC00", lineWidth: 3 });
          drawLandmarks(skelCtx, results.rightHandLandmarks, { color: "#FF8800", lineWidth: 1, radius: 3 });
          drawConnectors(skelCtx, results.faceLandmarks, FACEMESH_TESSELATION, { color: "#C0C0C070", lineWidth: 1 });
          skelCtx.restore();
        } else if (currentVrm) {
          // ========================================
          //  アバターモード - 全身トラッキング
          // ========================================

          // --- 顔 (Face) ---
          if (results.faceLandmarks) {
            const faceRig = Kalidokit.Face.solve(results.faceLandmarks, {
              runtime: "mediapipe",
              video: videoElement,
            });
            if (faceRig) {
              rigRotation("Head", faceRig.head, 0.7, 0.4);
              rigRotation("Neck", faceRig.head, 0.4, 0.4);

              // 表情（ブレンドシェイプ）
              if (currentVrm.expressionManager) {
                currentVrm.expressionManager.setValue("aa", faceRig.mouth.shape.A);
                currentVrm.expressionManager.setValue("ih", faceRig.mouth.shape.I);
                currentVrm.expressionManager.setValue("ou", faceRig.mouth.shape.U);
                currentVrm.expressionManager.setValue("ee", faceRig.mouth.shape.E);
                currentVrm.expressionManager.setValue("oh", faceRig.mouth.shape.O);
                currentVrm.expressionManager.setValue("blinkLeft", 1 - faceRig.eye.l);
                currentVrm.expressionManager.setValue("blinkRight", 1 - faceRig.eye.r);
                if (faceRig.pupil) {
                  currentVrm.expressionManager.setValue("lookLeft", faceRig.pupil.x < 0 ? -faceRig.pupil.x : 0);
                  currentVrm.expressionManager.setValue("lookRight", faceRig.pupil.x > 0 ? faceRig.pupil.x : 0);
                  currentVrm.expressionManager.setValue("lookUp", faceRig.pupil.y > 0 ? faceRig.pupil.y : 0);
                  currentVrm.expressionManager.setValue("lookDown", faceRig.pupil.y < 0 ? -faceRig.pupil.y : 0);
                }
              }
            }
          }

         // --- 体・腕・足 (Pose) ---
          if (results.poseLandmarks) {
            
            // 1. 体のひねり・足などはKalidokitに任せる（3Dデータが取れている場合）
            if (results.poseWorldLandmarks) {
              const poseRig = Kalidokit.Pose.solve(results.poseWorldLandmarks, results.poseLandmarks, {
                runtime: "mediapipe",
                video: videoElement,
              });

              if (poseRig) {
                // 腰と体のひねり
                rigRotation("Hips", poseRig.Hips.rotation, 0.7, 0.3);
                rigPosition("Hips", {
                  x: -poseRig.Hips.position.x, 
                  y: poseRig.Hips.position.y + 1.0, 
                  z: -poseRig.Hips.position.z
                }, 1, 0.07);
                rigRotation("Chest", poseRig.Spine, 0.25, 0.3);
                rigRotation("Spine", poseRig.Spine, 0.25, 0.3);
                // 足
                rigRotation("LeftUpperLeg", poseRig.LeftUpperLeg, 1, 0.3);
                rigRotation("LeftLowerLeg", poseRig.LeftLowerLeg, 1, 0.3);
                rigRotation("RightUpperLeg", poseRig.RightUpperLeg, 1, 0.3);
                rigRotation("RightLowerLeg", poseRig.RightLowerLeg, 1, 0.3);
              }
            }

            // 2. 💡腕のトラッキング（確実な2Dハイブリッド方式）
            // 近距離で3Dデータがフリーズしても、常に取れる2D画面座標から腕の角度を直接計算します
            const lm = results.poseLandmarks;
            const RIGHT_SHOULDER = 12, RIGHT_ELBOW = 14, RIGHT_WRIST = 16;
            const LEFT_SHOULDER = 11, LEFT_ELBOW = 13, LEFT_WRIST = 15;

            // 右腕 (右肩→右肘)
            if (lm[RIGHT_SHOULDER] && lm[RIGHT_ELBOW]) {
              const dx1 = lm[RIGHT_ELBOW].x - lm[RIGHT_SHOULDER].x;
              const dy1 = lm[RIGHT_ELBOW].y - lm[RIGHT_SHOULDER].y;
              const rightUpperArmAngle = Math.atan2(dy1, dx1); // Tポーズで0
              rigRotation("RightUpperArm", { x: 0, y: 0, z: -rightUpperArmAngle }, 1, 0.4);

              // 右前腕 (右肘→右手首)
              if (lm[RIGHT_WRIST]) {
                const dx2 = lm[RIGHT_WRIST].x - lm[RIGHT_ELBOW].x;
                const dy2 = lm[RIGHT_WRIST].y - lm[RIGHT_ELBOW].y;
                const rightLowerArmAngle = Math.atan2(dy2, dx2);
                let relativeAngle = rightLowerArmAngle - rightUpperArmAngle;
                // 角度が1回転しないように正規化
                if (relativeAngle > Math.PI) relativeAngle -= 2 * Math.PI;
                if (relativeAngle < -Math.PI) relativeAngle += 2 * Math.PI;
                rigRotation("RightLowerArm", { x: 0, y: 0, z: -relativeAngle }, 1, 0.4);
              }
            }

            // 左腕 (左肩→左肘)
            if (lm[LEFT_SHOULDER] && lm[LEFT_ELBOW]) {
              const dx1 = lm[LEFT_ELBOW].x - lm[LEFT_SHOULDER].x;
              const dy1 = lm[LEFT_ELBOW].y - lm[LEFT_SHOULDER].y;
              // 左腕はTポーズで左方向を向いているので -dx で計算
              const leftUpperArmAngle = Math.atan2(dy1, -dx1); 
              rigRotation("LeftUpperArm", { x: 0, y: 0, z: leftUpperArmAngle }, 1, 0.4);

              // 左前腕 (左肘→左手首)
              if (lm[LEFT_WRIST]) {
                const dx2 = lm[LEFT_WRIST].x - lm[LEFT_ELBOW].x;
                const dy2 = lm[LEFT_WRIST].y - lm[LEFT_ELBOW].y;
                const leftLowerArmAngle = Math.atan2(dy2, -dx2);
                let relativeAngle = leftLowerArmAngle - leftUpperArmAngle;
                if (relativeAngle > Math.PI) relativeAngle -= 2 * Math.PI;
                if (relativeAngle < -Math.PI) relativeAngle += 2 * Math.PI;
                rigRotation("LeftLowerArm", { x: 0, y: 0, z: relativeAngle }, 1, 0.4);
              }
            }
          }

          // --- 右手と指 (Right Hand) ---
          if (results.rightHandLandmarks) {
            const rightHandRig = Kalidokit.Hand.solve(results.rightHandLandmarks, "Right");
            if (rightHandRig) {
              for (const [boneName, rotation] of Object.entries(rightHandRig)) {
                rigRotation(boneName, rotation, 1, 0.3);
              }
            }
          }

          // VRM更新とレンダリング
          currentVrm.update(1.0 / 30.0);
          renderer.render(scene, camera);
        }
      });

      // --- 7. Camera Start ---
      window.onload = () => {
        new Camera(videoElement, {
          onFrame: async () => await holistic.send({ image: videoElement }),
          width: 640,
          height: 480,
        })
          .start()
          .then(() => {
            console.log("Camera started successfully");
          })
          .catch((err) => {
            console.error("Camera start error:", err);
            stVrm.innerText = "Camera Error";
            stVrm.style.color = "red";
          });
      };
    </script>
  </body>
</html>
